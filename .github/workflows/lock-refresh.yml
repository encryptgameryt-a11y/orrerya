name: Regenerate and verify dependency lockfile

on:
  push:
    branches:
      - security/astro-7-sharp-0355-a11y
    paths-ignore:
      - package-lock.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: security/astro-7-sharp-0355-a11y
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Reproduce clean install
        run: npm ci --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run project verification
        run: npm run verify
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh Astro and Sharp lockfile"
            git push origin security/astro-7-sharp-0355-a11y
          else
            echo "package-lock.json is already current."
          fi
