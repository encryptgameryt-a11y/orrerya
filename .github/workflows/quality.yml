name: Site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: orrerya-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
      - name: Preserve CI-resolved npm lockfile on the foundation branch
        if: github.event_name == 'pull_request' && github.head_ref == 'foundation/scientific-quality-2026-11' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          cp package-lock.json "$RUNNER_TEMP/orrerya-package-lock.json"
          git fetch origin "refs/heads/$BRANCH_NAME"
          git checkout -B "$BRANCH_NAME" FETCH_HEAD
          cp "$RUNNER_TEMP/orrerya-package-lock.json" package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add CI-resolved npm dependency lockfile"
            git push origin "HEAD:refs/heads/$BRANCH_NAME"
          fi
      - name: Build and verify site
        run: npm run verify
