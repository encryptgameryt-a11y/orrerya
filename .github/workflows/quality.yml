name: Site quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Build and verify site
        run: npm run verify
      - name: Upload responsive QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orrerya-visual-qa
          path: artifacts/visual-qa/
          if-no-files-found: ignore
          retention-days: 14
